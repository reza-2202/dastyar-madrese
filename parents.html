  function digits(v){
    return String(v==null?"":v)

  }
  function b64uToBytes(s){
    s=String(s||"").replace(/-/g,"+").replace(/_/g,"/");

    for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }
  async function shaHex(str){
    var b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(str)));

  async function deriveKey(secret, saltBytes){
    var material=await crypto.subtle.importKey("raw", new TextEncoder().encode(String(secret)), "PBKDF2", false, ["deriveKey"]);

  async function loadPackage(){

      try{
        var url=SB_URL.replace(/\/$/,"")+"/rest/v1/parent_portal_packages?token=eq."+encodeURIComponent(token)+"&select=*&limit=1";

      }catch(e){}

  async function doLogin(){

      var secret=parentSecret(identity, password, mode);

  }
  function parentTrendHtml(p){

  function date(r){var v=String(r&&(r.date||r.created_at||r.updated_at)||'').trim();if(!v)return '';if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(v))return v.slice(0,10).replace(/\//g,'-');var d=new Date(v);return isNaN(d.getTime())?'':d.toISOString().slice(0,10);}
  function num(v){if(v==null||v==='')return null;var x=Number(String(v).replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c);}).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}).replace(/,/g,''));return Number.isFinite(x)?x:null;}
  function aggregate(rows,fn){var m={};(rows||[]).forEach(function(r){var d=date(r),v=fn(r);if(!d||v==null)return;if(!m[d])m[d]=[];m[d].push(v);});return Object.keys(m).sort().map(function(d){var a=m[d];return {date:d,value:a.reduce(function(s,x){return s+x;},0)/a.length,count:a.length,total:a.reduce(function(s,x){return s+x;},0)};});}
  function chart(points,kind,color,maxVal){
   if(!points||points.length<2)return '<div style="font-size:12px;color:#64748b;padding:14px 8px;border:1px dashed #cbd5e1;border-radius:9px;background:#f8fafc;text-align:center">برای نمایش روند، دست‌کم دو تاریخ ثبت معتبر لازم است.</div>';
   var w=420,h=190,left=46,right=14,top=14,bottom=38,pw=w-left-right,ph=h-top-bottom;

   var ceiling=Number(maxVal)>0?Number(maxVal):Math.max(1,maxObserved);if(kind==='bar'&&maxObserved>ceiling)ceiling=maxObserved;

   for(var t=0;t<=4;t++){var val=yMax*t/4,yy=yAt(val);svg+='<line x1="'+left+'" y1="'+yy.toFixed(1)+'" x2="'+(w-right)+'" y2="'+yy.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="'+(t===0?'0':'3 4')+'"/><text x="'+(left-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#64748b">'+(val%1?val.toFixed(1):val.toFixed(0))+'</text>';}

   if(kind==='bar'){var slot=pw/points.length,bw=Math.max(5,Math.min(28,slot*.58));points.forEach(function(q,i){var x=xAt(i),y=yAt(q.value),height=top+ph-y;svg+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,height).toFixed(1)+'" rx="4" fill="'+color+'" opacity=".86"><title>'+esc(q.date)+' : '+Number(q.value).toFixed(1)+'</title></rect>';});}
   else{var pts=points.map(function(q,i){return {x:xAt(i),y:yAt(q.value),v:q.value,date:q.date};}),line='M'+pts[0].x.toFixed(1)+' '+pts[0].y.toFixed(1);for(var q=1;q<pts.length;q++){var prev=pts[q-1],cur=pts[q],mid=(prev.x+cur.x)/2;line+=' C'+mid.toFixed(1)+' '+prev.y.toFixed(1)+' '+mid.toFixed(1)+' '+cur.y.toFixed(1)+' '+cur.x.toFixed(1)+' '+cur.y.toFixed(1);}var area=line+' L'+pts[pts.length-1].x.toFixed(1)+' '+(top+ph)+' L'+pts[0].x.toFixed(1)+' '+(top+ph)+' Z';svg+='<path d="'+area+'" fill="url(#'+uid+'Fill)" stroke="none"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';pts.forEach(function(q){svg+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4.2" fill="#fff" stroke="'+color+'" stroke-width="2.6"><title>'+esc(q.date)+' : '+Number(q.v).toFixed(1)+'</title></circle>';});}
   var labels=[0,Math.floor((points.length-1)/2),points.length-1].filter(function(v,i,a){return a.indexOf(v)===i;});
   labels.forEach(function(i){var label=String(points[i].date||'');if(label.length>10)label=label.slice(5,10);else if(label.length===10)label=label.slice(5);svg+='<text x="'+xAt(i).toFixed(1)+'" y="'+(h-12)+'" text-anchor="'+(i===0?'start':i===points.length-1?'end':'middle')+'" font-size="10" fill="#475569">'+esc(label)+'</text>';});
   return svg+'</svg><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10px;color:#64748b;margin-top:3px"><span>محور افقی: تاریخ ثبت</span><span>محور عمودی: مقدار شاخص</span></div>';
  }
  function analyze(rows,unit,goodHigh){if(rows.length<2)return 'هنوز برای مقایسه زمانی، ثبت تاریخ‌دار کافی وجود ندارد.';var a=rows[0].value,b=rows[rows.length-1].value,d=b-a;if(Math.abs(d)<.15)return 'در بازه ثبت‌شده تغییر چشمگیری دیده نمی‌شود؛ مقدار پایانی '+b.toFixed(1)+' '+unit+' است.';var up=d>0;return (up?'افزایش':'کاهش')+' از '+a.toFixed(1)+' به '+b.toFixed(1)+' '+unit+' مشاهده می‌شود؛ '+((goodHigh?up:!up)?'این تغییر از نظر شاخص ثبت‌شده مطلوب‌تر است.':'این تغییر نیازمند بررسی سوابق و گفت‌وگو با دانش‌آموز است.');}
  var scores=arr(p.scores),evals=arr(p.evaluations),acts=arr(p.exams).concat(arr(p.activities).filter(function(x){return x&&['exam','qa','evaluation'].indexOf(x.type)>=0;}));
  var education=scores.concat(evals,acts),seen={};education=education.filter(function(r){var v=num(r.score),d=date(r);if(v==null||v<0||v>20||!d)return false;var k=[d,r.subject||r.lesson||'',v,r.type||''].join('|');if(seen[k])return false;seen[k]=1;return true;});
  var ed=aggregate(education,function(r){var v=num(r.score);return v==null?null:v;});
