      return "<div class='section' style='break-inside:avoid'><h3>📈 روند رشد و افت دانش‌آموز</h3><div class='item' style='color:#64748b'>بر پایه ثبت‌های تاریخ‌دار معلم؛ حداکثر شش ماه اخیر</div>"+panel("روند آموزشی","میانگین نمره‌های تاریخ‌دار (از ۲۰)",line("academic",20,"#2563eb"),"#1d4ed8")+panel("روند حضور و غیاب","درصد روزهای حضور یا تأخیر از کل ثبت‌ها",line("attendance",100,"#059669"),"#047857")+panel("ثبت‌های انضباطی","تعداد موارد ثبت‌شده در هر ماه","<svg viewBox='0 0 330 118' style='width:100%;height:auto;display:block'><line x1='12' y1='96' x2='322' y2='96' stroke='#cbd5e1'/>"+bar+"</svg>","#b45309")+"<div class='item' style='background:#f8fafc;line-height:1.9'><b>تحلیل تغییرات</b><ul style='margin:5px 18px 0 0;padding:0'>"+notes.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul><small>نبود ثبت در یک ماه به معنی افت یا پیشرفت نیست؛ افزایش یا کاهش موارد انضباطی نیز به‌تنهایی معادل قضاوت درباره رفتار نیست.</small></div></div>";
    }

    var html="";
    var custom=st.custom_fields||{};if(typeof custom==="string"){try{custom=JSON.parse(custom)}catch(e){custom={}}}
    var customRows=Array.isArray(custom)?custom.filter(function(x){return x&&String(x.title||"").trim();}):Object.keys(custom&&typeof custom==="object"?custom:{}).map(function(k){return {title:k,value:custom[k]};});
    html+=list("سایر مشخصات دانش‌آموز",customRows,function(x){return "<div class=\"item\"><b>"+esc(x.title||"مشخصه")+":</b> "+esc(x.value)+"</div>";});
    html+=list("حضور و غیاب",dateSort(p.attendance),function(a){return "<div class=\"item\">"+faDigits(esc(a.weekday||""))+" "+faDigits(esc(a.date||""))+" — "+esc(trStatus(a.status))+(a.notice_approved?" — تأیید مدیر ثبت شده":"")+(a.recorded_by?" — ثبت‌کننده: "+esc(a.recorded_by):"")+(a.note?(" — "+esc(a.note)):"")+"</div>";});
    var allActivities=arr(p.activities);
    var exams=arr(p.exams);if(!exams.length)exams=allActivities.filter(function(a){return a&&a.type==="exam";});
    var followups=arr(p.absence_followups);if(!followups.length)followups=allActivities.filter(function(a){return a&&(a.type==="absence_followup"||a.subject==="پیگیری غیبت مدیر");});
    var activities=allActivities.filter(function(a){return a&&a.type!=="exam"&&a.type!=="absence_followup"&&a.subject!=="پیگیری غیبت مدیر";});
    html+=list("پرسش و پاسخ / فعالیت",dateSort(activities),function(a){return "<div class=\"item\">"+faDigits(esc(a.date||""))+" — "+esc(trSubject(a.subject||a.lesson||""))+" — "+esc(trLevel(a.level||a.score||a.result||""))+(a.notes?(" — "+esc(a.notes)):"")+(a.recorded_by?(" — ثبت‌کننده: "+esc(a.recorded_by)):"")+"</div>";});
    html+=list("آزمون‌های کتبی / مدادکاغذی",dateSort(exams),function(a){return "<div class=\"item\"><b>"+esc(a.exam_name||a.name||a.subject||"آزمون")+"</b> — "+faDigits(esc(a.weekday||""))+" "+faDigits(esc(a.date||""))+" — درس: "+esc(trSubject(a.subject||a.lesson||""))+" — نمره: "+esc(a.score==null||a.score===""?"—":a.score)+" — "+esc(trLevel(a.level||""))+(a.chapters?(" — مباحث: "+esc(a.chapters)):"")+(a.notes||a.desc_text||a.description?(" — "+esc(a.notes||a.desc_text||a.description)):"")+(a.recorded_by?(" — ثبت‌کننده: "+esc(a.recorded_by)):"")+"</div>";});
    html+=list("سوابق پیگیری غیبت",dateSort(followups),function(a){var raw=String(a.notes||"");var token=raw.match(/\[ABSENCE_CYCLE:([^|\]]+)\|([^\]]+)\]/);var range=raw.match(/چرخه پیگیری:\s*([^\n]+)/);var count=raw.match(/تعداد غیبت\/تأخیر در این چرخه:\s*([^\n]+)/);var clean=raw.replace(/^\[ABSENCE_CYCLE:[^\]]+\]\s*/,"").replace(/چرخه پیگیری:[^\n]*\n?/,"").replace(/تعداد غیبت\/تأخیر در این چرخه:[^\n]*\n?/,"").replace(/^توضیحات مدیر:\s*/,"").trim();return "<div class=\"item\"><b>رسیدگی مستقل</b>"+(token?" — "+esc(token[1])+" تا "+esc(token[2]):"")+" — "+faDigits(esc(range?range[1]:(a.date||"")))+(count?" — "+esc(count[1]):"")+(clean?"<div>"+esc(clean)+"</div>":"")+(a.recorded_by?" — ثبت‌کننده: "+esc(a.recorded_by):"")+"</div>";});
    html+=list("ارزشیابی",dateSort(p.evaluations),function(a){return "<div class=\"item\">"+faDigits(esc(a.month||a.date||""))+" — "+esc(trSubject(a.subject||""))+" — "+esc(trLevel(a.level||a.score||""))+(a.score!=null?(" — نمره: "+esc(a.score)):"")+(a.notes?(" — "+esc(a.notes)):"")+(a.recorded_by?(" — ثبت‌کننده: "+esc(a.recorded_by)):"")+"</div>";});
    html+=list("نمرات",dateSort(p.scores),function(a){return "<div class=\"item\">"+esc(trSubject(a.subject||""))+" — نمره: "+esc(a.score==null?"—":a.score)+" — "+esc(trLevel(a.level||""))+(a.notes?(" — "+esc(a.notes)):"")+"</div>";});
    var progressMap=Object.create(null);
    arr(p.scores).concat(arr(p.evaluations)).forEach(function(r){var raw=r&&r.score;if(raw==null||raw==="")return;var value=Number(String(raw).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);}).replace(/,/g,""));if(!Number.isFinite(value))return;var subject=trSubject(r.subject||r.lesson||"سایر");if(!progressMap[subject])progressMap[subject]={sum:0,count:0};progressMap[subject].sum+=value;progressMap[subject].count++;});
    var progress=Object.keys(progressMap).map(function(subject){return {subject:subject,avg:progressMap[subject].sum/progressMap[subject].count,count:progressMap[subject].count};});
    var scale=progress.some(function(x){return x.avg>20;})?100:20;
    html+=list("نمودار پیشرفت تحصیلی",progress,function(x){var pct=Math.max(0,Math.min(100,x.avg/scale*100));return "<div class=\"item\" style=\"display:grid;grid-template-columns:minmax(70px,1fr) 2fr auto;gap:7px;align-items:center\"><b>"+esc(x.subject)+"</b><div style=\"height:10px;background:#e2e8f0;border-radius:9px;overflow:hidden\"><div style=\"height:100%;width:"+pct.toFixed(1)+"%;background:#2563eb\"></div></div><span>"+faDigits(x.avg.toFixed(1))+" از "+faDigits(scale)+"</span></div>";});
    html+=portalTrendHtml(p);
    html+=list("شایستگی‌ها",dateSort(p.competencies),function(a){return "<div class=\"item\">"+esc(a.name||a.title||"شایستگی")+" — "+esc(trLevel(a.level||a.result||a.score||""))+(a.notes?(" — "+esc(a.notes)):"")+"</div>";});
    html+=list("انضباط",dateSort(p.discipline),function(a){return "<div class=\"item\">"+faDigits(esc(a.date||""))+" — "+esc(a.feedback||a.category||a.topic||"—")+(a.details?(" — "+esc(a.details)):"")+(a.decision_text?(" — "+esc(a.decision_text)):"")+(a.status?(" — وضعیت: "+esc(a.status==="approved"?"رسیدگی شده":a.status)):"")+(a.created_by?(" — ثبت‌کننده: "+esc(a.created_by)):"")+(a.approved_by?(" — تأییدکننده: "+esc(a.approved_by)):"")+"</div>";});
    html+=list("سوابق مالی",dateSort(p.finance),function(a){var amount=a.amount==null?"—":faDigits(a.amount);return "<div class=\"item\"><b>"+esc(a.topic||a.title||"مالی")+"</b> — "+faDigits(esc(a.date||""))+" — مبلغ: "+esc(amount)+(a.notes?(" — "+esc(a.notes)):"")+(a.status?(" — وضعیت: "+esc(a.status)):"")+(a.created_by?(" — ثبت‌کننده: "+esc(a.created_by)):"")+"</div>";});
    html+=list("ارتباط و پیگیری با اولیا",dateSort(p.parent_contacts),function(a){var types={call:"تماس",message:"پیام",inperson:"حضوری",other:"سایر"};return "<div class=\"item\"><b>"+esc(types[a.contact_type]||a.contact_type||"ارتباط")+"</b> — "+faDigits(esc(a.date||""))+(a.phone?(" — "+esc(a.phone)):"")+(a.subject?(" — موضوع: "+esc(a.subject)):"")+(a.result?(" — نتیجه: "+esc(a.result)):"")+(a.follow_up_date?(" — پیگیری: "+faDigits(esc(a.follow_up_date))):"")+(a.notes?(" — "+esc(a.notes)):"")+(a.recorded_by?(" — ثبت‌کننده: "+esc(a.recorded_by)):"")+"</div>";});
    $("v-body").innerHTML=html;
  }
