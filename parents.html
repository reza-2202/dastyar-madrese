(function(){

  var SB_KEY="sb_publishable_7T0rFOE6BDPqyym3CjSRKQ_DwOV_TN0";

  function showErr(m){var e=$("err");e.style.display="block";e.textContent=m||"خطا";}

  function digits(v){
    return String(v==null?"":v)
      .replace(/[۰-۹]/g,function(c){return String("۰۱۲۳۴۵۶۷۸۹".indexOf(c));})

  function b64uToBytes(s){

  }

  }

  async function doLogin(){

      var loginHash=await shaHex(String(pkg.package_salt||"")+"|"+mode+"|"+identity);

    function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

    function trStatus(v){var s=String(v||"").toLowerCase().trim();var m={present:"حاضر",absent:"غایب",excused:"غایب موجه",late:"تأخیر",absent_excused:"غایب موجه",absent_unexcused:"غایب غیرموجه",unexcused:"غایب غیرموجه",motevajjeh:"غایب موجه","حاضر":"حاضر","غایب":"غایب","موجه":"غایب موجه","تاخیر":"تأخیر","تأخیر":"تأخیر"};return m[s]||m[String(v||"").trim()]||(v?String(v):"—");}
    function trLevel(v){var s=String(v||"").toLowerCase().trim();var m={"very good":"خیلی خوب",very_good:"خیلی خوب",excellent:"عالی",good:"خوب",acceptable:"قابل قبول","need effort":"نیاز به تلاش","needs effort":"نیاز به تلاش",needs_effort:"نیاز به تلاش",need_effort:"نیاز به تلاش",poor:"نیاز به تلاش",weak:"نیاز به تلاش",fair:"قابل قبول",average:"قابل قبول","خیلی خوب":"خیلی خوب","خوب":"خوب","قابل قبول":"قابل قبول","نیاز به تلاش":"نیاز به تلاش","عالی":"عالی"};return m[s]||m[String(v||"").trim()]||(v?String(v):"—");}

    function arr(v){return Array.isArray(v)?v:[];}
    function list(title,rows,fmt){rows=arr(rows);var h="<div class=\"section\"><h3>"+title+" ("+faDigits(rows.length)+")</h3>";if(!rows.length)return h+"<div class=\"item\">موردی ثبت نشده است</div></div>";return h+rows.map(fmt).join("")+"</div>";}
